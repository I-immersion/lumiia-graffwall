<!DOCTYPE html>
<!-- LUMIIA MUR DE GRAFF — GALERIE v1.0 — lecture de /graffwall (lumiia-live) -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMIIA Mur de Graff — Galerie</title>
<style>
  :root{
    --fond:#131209; --panneau:#1c1b13; --trace:#f2f0e6; --acid:#c8ff1e;
    --rouille:#d1441f; --ligne:rgba(242,240,230,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--fond);color:var(--trace);min-height:100vh;
    font-family:system-ui,"Segoe UI",Roboto,sans-serif;
  }
  header{
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    padding:20px 26px;border-bottom:2px solid var(--ligne);
    position:sticky;top:0;background:rgba(19,18,9,.96);z-index:10;
    backdrop-filter:blur(6px);
  }
  h1{
    font-family:Impact,Haettenschweiler,"Arial Narrow",sans-serif;
    font-size:30px;letter-spacing:.01em;text-transform:uppercase;
    transform:skewX(-7deg);font-weight:400;
  }
  h1 span{color:var(--acid)}
  #compte{font-size:13px;color:rgba(242,240,230,.5);letter-spacing:.06em}
  #jours{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .jour{
    border:2px solid var(--ligne);background:#26241a;color:var(--trace);
    border-radius:8px;padding:10px 15px;cursor:pointer;font-size:14px;font-weight:700;
    letter-spacing:.04em;
  }
  .jour[aria-current="true"]{background:var(--trace);color:#16150f;border-color:var(--trace)}
  .jour small{display:block;font-size:11px;opacity:.6;font-weight:600}

  #grille{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:16px;padding:22px 26px 60px;
  }
  .carte{
    background:var(--panneau);border:2px solid var(--ligne);border-radius:12px;
    overflow:hidden;cursor:pointer;transition:border-color .12s,transform .12s;
  }
  .carte:hover{border-color:var(--acid);transform:translateY(-2px)}
  .carte img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
  .carte .pied{padding:9px 12px;display:flex;justify-content:space-between;gap:10px;font-size:12px}
  .carte .pied b{font-weight:800;letter-spacing:.04em}
  .carte .pied span{color:rgba(242,240,230,.5)}

  #vide{padding:60px 26px;color:rgba(242,240,230,.5);font-size:16px;line-height:1.6}
  #vide code{background:#26241a;padding:2px 7px;border-radius:4px;font-size:13px}

  /* visionneuse */
  #vue{
    position:fixed;inset:0;background:rgba(8,7,4,.95);z-index:50;
    display:none;flex-direction:column;padding:18px;gap:14px;
  }
  #vue.on{display:flex}
  #vue img{flex:1;min-height:0;object-fit:contain;width:100%}
  #barre{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .act{
    border:2px solid var(--ligne);background:#26241a;color:var(--trace);
    border-radius:9px;padding:13px 20px;cursor:pointer;font-size:14px;font-weight:800;
    letter-spacing:.05em;text-transform:uppercase;text-decoration:none;
    display:inline-flex;align-items:center;gap:9px;
  }
  .act:hover{border-color:var(--acid)}
  .act.vert{border-color:#25d366}
  .act.rouge{border-color:rgba(209,68,31,.6);color:#f0b6a4}
  .act svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #info{text-align:center;font-size:13px;color:rgba(242,240,230,.55);letter-spacing:.05em}
</style>
</head>
<body>

<header>
  <h1><span>LUMIIA</span> Mur de Graff — Galerie</h1>
  <div id="compte">chargement…</div>
  <div id="jours"></div>
</header>

<div id="grille"></div>
<div id="vide" hidden></div>

<div id="vue">
  <img id="vueImg" alt="">
  <div id="info"></div>
  <div id="barre">
    <button class="act" id="aPartager" hidden>
      <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      Partager
    </button>
    <a class="act vert" id="aWhats" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.7 7.4L3 21l2.2-5.2A8.5 8.5 0 1 1 21 11.5z"/></svg>
      WhatsApp
    </a>
    <a class="act" id="aMail">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      Mail
    </a>
    <button class="act" id="aCopier">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      Copier le lien
    </button>
    <button class="act" id="aTelecharger">
      <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 21h16"/></svg>
      Télécharger
    </button>
    <button class="act rouge" id="aSupprimer">
      <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>
      Supprimer
    </button>
    <button class="act" id="aFermer">Fermer</button>
  </div>
</div>

<script>
(function(){
"use strict";
var BUCKET = "lumiia-live.firebasestorage.app";
var RTDB   = "https://lumiia-live-default-rtdb.europe-west1.firebasedatabase.app";

var elJours=document.getElementById("jours"), elGrille=document.getElementById("grille"),
    elVide=document.getElementById("vide"), elCompte=document.getElementById("compte"),
    vue=document.getElementById("vue"), vueImg=document.getElementById("vueImg"),
    info=document.getElementById("info");
var jours=[], jourActif=null, items=[], courant=null;

function frJour(j){
  var d=new Date(j+"T12:00:00");
  return d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
}
function message(html){ elVide.hidden=false; elVide.innerHTML=html; }

/* ---------- chargement ---------- */
fetch(RTDB+"/graffwall/index.json?shallow=true")
  .then(function(r){
    if(!r.ok) throw new Error("RTDB "+r.status);
    return r.json();
  })
  .then(function(o){
    jours = o ? Object.keys(o).sort().reverse() : [];
    if(!jours.length){
      elCompte.textContent="aucune fresque";
      message("Rien d'enregistré pour l'instant.<br>Les fresques arrivent ici dès qu'on appuie sur <code>Enregistrer</code> sur le mur.");
      return;
    }
    jours.forEach(function(j,n){
      var b=document.createElement("button");
      b.className="jour"; b.innerHTML=frJour(j)+"<small>"+j+"</small>";
      b.addEventListener("click", function(){ ouvrirJour(j); });
      elJours.appendChild(b);
    });
    ouvrirJour(jours[0]);
  })
  .catch(function(e){
    elCompte.textContent="lecture impossible";
    message("Impossible de lire la base : <code>"+e.message+"</code><br><br>"+
            "Il manque probablement la règle de lecture sur <code>/graffwall</code> dans la Realtime Database.");
  });

function ouvrirJour(j){
  jourActif=j;
  [].forEach.call(elJours.children,function(b,n){
    b.setAttribute("aria-current", jours[n]===j ? "true":"false");
  });
  elGrille.innerHTML=""; elVide.hidden=true;
  elCompte.textContent="chargement…";
  fetch(RTDB+"/graffwall/index/"+j+".json")
    .then(function(r){ return r.json(); })
    .then(function(o){
      items=[];
      for(var id in o){ var it=o[id]; it.id=id; items.push(it); }
      items.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
      elCompte.textContent = items.length+(items.length>1?" fresques":" fresque")+" · "+frJour(j);
      items.forEach(function(it,n){
        var c=document.createElement("div");
        c.className="carte";
        c.innerHTML='<img loading="lazy" src="'+it.vig+'" alt="">'+
          '<div class="pied"><b>'+(it.heure||"").replace("h","h").replace("m","")+'</b>'+
          '<span>'+(it.support||"")+'</span></div>';
        c.addEventListener("click", function(){ montrer(n); });
        elGrille.appendChild(c);
      });
    });
}

/* ---------- visionneuse ---------- */
function montrer(n){
  courant=items[n];
  vueImg.src=courant.url;
  info.textContent=(courant.support||"")+" · "+frJour(jourActif)+" à "+(courant.heure||"").replace("h","h").replace("m","min");
  var texte="Mon graff LUMIIA : "+courant.url;
  document.getElementById("aWhats").href="https://wa.me/?text="+encodeURIComponent(texte);
  document.getElementById("aMail").href="mailto:?subject="+
    encodeURIComponent("Ma fresque LUMIIA")+"&body="+encodeURIComponent(texte);
  document.getElementById("aPartager").hidden = !navigator.share;
  vue.classList.add("on");
}
document.getElementById("aFermer").addEventListener("click", function(){ vue.classList.remove("on"); });
vue.addEventListener("click", function(e){ if(e.target===vue) vue.classList.remove("on"); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape") vue.classList.remove("on"); });

document.getElementById("aPartager").addEventListener("click", function(){
  if(!navigator.share) return;
  navigator.share({ title:"Ma fresque LUMIIA", text:"Mon graff LUMIIA", url:courant.url })
    .catch(function(){});
});
document.getElementById("aCopier").addEventListener("click", function(){
  var b=this;
  navigator.clipboard.writeText(courant.url).then(function(){
    var v=b.lastChild.textContent; b.lastChild.textContent=" Lien copié";
    setTimeout(function(){ b.lastChild.textContent=v; },1600);
  });
});
document.getElementById("aTelecharger").addEventListener("click", function(){
  fetch(courant.url).then(function(r){ return r.blob(); }).then(function(b){
    var u=URL.createObjectURL(b), a=document.createElement("a");
    a.href=u; a.download="graff_"+jourActif+"_"+(courant.heure||"")+".jpg";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(u); },3000);
  });
});
document.getElementById("aSupprimer").addEventListener("click", function(){
  if(!confirm("Supprimer définitivement cette fresque ?")) return;
  var it=courant;
  fetch(RTDB+"/graffwall/index/"+jourActif+"/"+it.id+".json",{method:"DELETE"})
    .then(function(){
      ["graffwall/"+jourActif+"/"+it.id+".jpg","graffwall/"+jourActif+"/"+it.id+"_v.jpg"]
        .forEach(function(p){
          fetch("https://firebasestorage.googleapis.com/v0/b/"+BUCKET+"/o/"+
                encodeURIComponent(p),{method:"DELETE"}).catch(function(){});
        });
      vue.classList.remove("on"); ouvrirJour(jourActif);
    });
});
})();
</script>
</body>
</html>
