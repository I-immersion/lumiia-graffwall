<!DOCTYPE html>
<!-- LUMIIA MUR DE GRAFF — PHOTO v4.7 — cadrage tactile depuis le telephone -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#131209">
<title>LUMIIA — Envoyer sur le mur</title>
<style>
  :root{ --fond:#131209; --trace:#f2f0e6; --acid:#c8ff1e; --rouille:#d1441f; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--fond);color:var(--trace);
    font-family:system-ui,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:12px 12px 16px;gap:9px;user-select:none;
  }
  header{display:flex;align-items:baseline;gap:10px;width:100%;max-width:520px}
  h1{
    font-family:Impact,Haettenschweiler,"Arial Narrow",sans-serif;font-weight:400;
    font-size:20px;text-transform:uppercase;transform:skewX(-7deg);letter-spacing:.01em;
  }
  h1 span{color:var(--acid)}
  #salle{font-size:11px;letter-spacing:.22em;color:rgba(242,240,230,.45);font-weight:700;margin-left:auto;cursor:pointer}

  #scene{
    position:relative;width:100%;max-width:520px;aspect-ratio:16/9;
    border-radius:12px;overflow:hidden;background:#000;
    border:2px solid rgba(242,240,230,.16);touch-action:none;
  }
  #scene canvas{position:absolute;inset:0;width:100%;height:100%}
  #vide{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:rgba(242,240,230,.35);font-size:14px;text-align:center;padding:20px;
  }
  #consigne{
    position:absolute;left:0;right:0;bottom:0;padding:7px;text-align:center;
    background:linear-gradient(transparent,rgba(0,0,0,.78));font-size:12px;
    color:rgba(242,240,230,.85);letter-spacing:.02em;
  }

  .rangee{display:flex;gap:8px;width:100%;max-width:520px}
  .btn{
    flex:1;border:0;border-radius:11px;padding:15px 8px;
    font-size:14px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
    background:#2c2921;color:var(--trace);
  }
  .btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .btn.clair{background:var(--trace);color:#16150f}
  .btn.vif{background:var(--acid);color:#16150f}
  .btn.rouge{background:#3a1c12;color:#eab5a5}
  .btn[disabled]{opacity:.3}
  .btn.mince{flex:0 0 62px;padding:15px 0}

  #onglets .btn{padding:11px 6px;font-size:12px}
  #onglets .btn[aria-current="true"]{background:var(--trace);color:#16150f}
  #pastilles{
    display:none;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;max-width:520px;
    max-height:32vh;overflow-y:auto;padding:5px;
    background:#1c1b13;border-radius:12px;border:2px solid rgba(242,240,230,.12);
  }
  #pastilles.on{display:grid}
  #pastilles button{border:0;background:#26241a;border-radius:9px;padding:6px 2px;font-size:26px;cursor:pointer;line-height:1.1;min-height:46px}
  #pastilles.large{grid-template-columns:repeat(3,1fr)}
  #pastilles img{width:100%;height:38px;object-fit:contain;display:block}
  #pastilles button:active{background:var(--acid)}
  #mesObjets{
    display:none;gap:7px;width:100%;max-width:520px;overflow-x:auto;padding:2px;
  }
  #mesObjets.on{display:flex}
  #mesObjets button{
    flex:0 0 54px;height:54px;border-radius:10px;border:2px solid rgba(242,240,230,.18);
    background:#1c1b13;padding:0;overflow:hidden;cursor:pointer;
  }
  #mesObjets button[aria-current="true"]{border-color:var(--acid)}
  #mesObjets img{width:100%;height:100%;object-fit:contain;display:block}
  #etat{font-size:13px;min-height:18px;letter-spacing:.03em;text-align:center}
  #etat.ok{color:var(--acid)} #etat.ko{color:#f0907a}
  input[type=file]{display:none}

  #rejoindre{
    position:fixed;inset:0;background:rgba(10,9,6,.96);z-index:20;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:26px;
  }
  #rejoindre.on{display:flex}
  #rejoindre input{
    width:230px;padding:16px;border-radius:11px;border:2px solid rgba(242,240,230,.25);
    background:#1c1b13;color:var(--acid);font:800 30px/1 ui-monospace,Menlo,monospace;
    text-align:center;letter-spacing:.3em;text-transform:uppercase;
  }
  #rejoindre p{font-size:14px;color:rgba(242,240,230,.6);text-align:center;max-width:330px;line-height:1.6}
</style>
</head>
<body>

<header>
  <h1><span>LUMIIA</span> Mur de Graff</h1>
  <div id="salle">—</div>
</header>

<div id="scene">
  <canvas id="vue"></canvas>
  <div id="vide">Le mur apparaîtra ici</div>
  <div id="consigne">Touche un objet pour le reprendre</div>
</div>

<div class="rangee">
  <label class="btn clair" for="fichier">
    <svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="4"/></svg>
    Photo
  </label>
  <input type="file" id="fichier" accept="image/*" capture="environment">
  <button class="btn" id="ouvrirPastilles">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/></svg>
    Pastilles
  </button>
</div>

<div id="onglets" class="rangee" style="display:none">
  <button class="btn" data-onglet="emoji" aria-current="true">Emojis</button>
  <button class="btn" data-onglet="mot">Mots</button>
  <button class="btn" data-onglet="visage">Visage</button>
</div>
<div id="pastilles"></div>
<div id="mesObjets"></div>

<div class="rangee">
  <button class="btn vif" id="coller" disabled>
    <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span> Coller sur le mur</span>
  </button>
  <button class="btn rouge mince" id="retirer" disabled>
    <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
</div>

<div id="etat"></div>

<div id="rejoindre">
  <h1><span>LUMIIA</span> Mur de Graff</h1>
  <p>Saisis le code affiché sous le QR code du mur.</p>
  <input id="champSalle" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="····">
  <button class="btn vif" id="valider" style="max-width:230px">Rejoindre</button>
</div>

<script>
/* Pastilles dessinees — mots et accessoires de visage.
   Tout est trace au canvas : aucun fichier image, aucun droit a demander,
   et le rendu reste net a n'importe quelle taille. */
var PASTILLES = (function(){
"use strict";

/* ---------- mots ---------- */
var MOTS = [
  { t:"BOOM",   f:"#ffd400", b:"#e01b24", s:"bulle" },
  { t:"POW!",   f:"#ff6a00", b:"#14120f", s:"bulle" },
  { t:"WAOUH",  f:"#00b7e4", b:"#0b2a52", s:"bulle" },
  { t:"BRAVO",  f:"#8cc63f", b:"#14120f", s:"bulle" },
  { t:"SUPER",  f:"#ff2d95", b:"#3b0a26", s:"bulle" },
  { t:"MERCI",  f:"#f5f3ee", b:"#8e44ad", s:"bulle" },
  { t:"SALUT",  f:"#ffd400", b:"#0055d4", s:"bulle" },
  { t:"COOL",   f:"#00e5c0", b:"#083b33", s:"bulle" },
  { t:"TOP",    f:"#e01b24", b:"#14120f", s:"bulle" },
  { t:"LOVE",   f:"#ff2d95", b:"#f5f3ee", s:"bulle" },
  { t:"OUAIS",  f:"#ff6a00", b:"#14120f", s:"bulle" },
  { t:"CHAMPION", f:"#ffd400", b:"#7a4b2a", s:"bulle" },
  { t:"LEVEL UP", f:"#ffb020", b:"#4a1a86", s:"pixel" },
  { t:"GAME OVER",f:"#e01b24", b:"#14120f", s:"pixel" },
  { t:"NEW HIGH", f:"#8cc63f", b:"#14120f", s:"pixel" },
  { t:"BONUS",  f:"#00b7e4", b:"#0b2a52", s:"pixel" },
  { t:"START",  f:"#f5f3ee", b:"#14120f", s:"pixel" },
  { t:"JOYEUX ANNIV", f:"#00b7e4", b:"#f5f3ee", s:"bulle" },
  { t:"FELICITATIONS", f:"#ffd400", b:"#e01b24", s:"bulle" },
  { t:"BIENVENUE", f:"#8cc63f", b:"#14120f", s:"bulle" },
  { t:"LUMIIA", f:"#c8ff1e", b:"#14120f", s:"bulle" },
  { t:"1ER",    f:"#ffd400", b:"#7a4b2a", s:"pixel" }
];

function motCanvas(m, T){
  var L=T, H=Math.round(T*0.52);
  var c=document.createElement("canvas"); c.width=L; c.height=H;
  var g=c.getContext("2d");
  var police = m.s==="pixel"
    ? "'Courier New',monospace"
    : "Impact,Haettenschweiler,'Arial Narrow',sans-serif";
  var taille=Math.round(H*(m.s==="pixel"?0.80:0.62)), tr;
  g.textAlign="center"; g.textBaseline="middle";
  do {
    g.font = (m.s==="pixel"?"bold ":"")+taille+"px "+police;
    tr=g.measureText(m.t).width;
    var lim = L*(m.s==="pixel"?0.94:0.86);
    if(tr > lim) taille -= 2;
  } while(tr > lim && taille > 10);

  var x=L/2, y=H*0.54;
  if(m.s==="pixel"){
    // rendu en petit puis agrandi sans lissage : les bords deviennent carres
    var p=document.createElement("canvas");
    p.width=Math.round(L/6); p.height=Math.round(H/6);
    var pg=p.getContext("2d");
    pg.textAlign="center"; pg.textBaseline="middle";
    pg.font="bold "+Math.round(taille/6)+"px "+police;
    pg.fillStyle=m.b;
    pg.fillText(m.t, p.width/2+1, p.height*0.54+1);
    pg.fillStyle=m.f;
    pg.fillText(m.t, p.width/2, p.height*0.54);
    g.imageSmoothingEnabled=false;
    g.drawImage(p,0,0,L,H);
    return c;
  }
  g.lineJoin="round";
  g.strokeStyle="rgba(0,0,0,.35)"; g.lineWidth=taille*0.30;
  g.strokeText(m.t, x+taille*0.05, y+taille*0.06);      // ombre portee
  g.strokeStyle=m.b; g.lineWidth=taille*0.26;
  g.strokeText(m.t, x, y);
  g.strokeStyle="#ffffff"; g.lineWidth=taille*0.11;
  g.strokeText(m.t, x, y);
  var grad=g.createLinearGradient(0, y-taille*0.5, 0, y+taille*0.5);
  grad.addColorStop(0, "#ffffff");
  grad.addColorStop(.32, m.f);
  grad.addColorStop(1, m.f);
  g.fillStyle=grad;
  g.fillText(m.t, x, y);
  return c;
}

/* ---------- accessoires de visage ---------- */
function trait(g,c,w){ g.strokeStyle=c; g.lineWidth=w; g.lineJoin="round"; g.lineCap="round"; }
function contour(g,w){ g.strokeStyle="#14120f"; g.lineWidth=w; g.stroke(); }

var VISAGES = [
  { n:"Lunettes noires", d:function(g,T){
      var w=T*0.40, h=T*0.26, y=T*0.5;
      [[T*0.29,-1],[T*0.71,1]].forEach(function(p){
        g.fillStyle="#14120f";
        g.beginPath(); g.ellipse(p[0], y, w*0.44, h*0.5, 0,0,Math.PI*2); g.fill();
        g.strokeStyle="#3a3a3a"; g.lineWidth=T*0.022; g.stroke();
        var gr=g.createLinearGradient(p[0]-w*0.4, y-h*0.5, p[0]+w*0.2, y+h*0.3);
        gr.addColorStop(0,"rgba(255,255,255,.35)"); gr.addColorStop(.5,"rgba(255,255,255,0)");
        g.fillStyle=gr; g.beginPath(); g.ellipse(p[0], y, w*0.44, h*0.5, 0,0,Math.PI*2); g.fill();
      });
      trait(g,"#14120f",T*0.035);
      g.beginPath(); g.moveTo(T*0.45,y-T*0.02); g.lineTo(T*0.55,y-T*0.02); g.stroke();
      g.beginPath(); g.moveTo(T*0.11,y-T*0.06); g.lineTo(T*0.05,y-T*0.10); g.stroke();
      g.beginPath(); g.moveTo(T*0.89,y-T*0.06); g.lineTo(T*0.95,y-T*0.10); g.stroke();
    }},
  { n:"Lunettes rondes", d:function(g,T){
      var y=T*0.5, r=T*0.16;
      [T*0.30,T*0.70].forEach(function(x){
        g.fillStyle="rgba(190,225,240,.45)";
        g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
        trait(g,"#c8a24a",T*0.032); g.stroke();
      });
      trait(g,"#c8a24a",T*0.030);
      g.beginPath(); g.moveTo(T*0.46,y); g.lineTo(T*0.54,y); g.stroke();
      g.beginPath(); g.moveTo(T*0.14,y-T*0.03); g.lineTo(T*0.05,y-T*0.09); g.stroke();
      g.beginPath(); g.moveTo(T*0.86,y-T*0.03); g.lineTo(T*0.95,y-T*0.09); g.stroke();
    }},
  { n:"Lunettes 3D", d:function(g,T){
      var y=T*0.5, w=T*0.30, h=T*0.22;
      g.fillStyle="rgba(224,27,36,.72)"; g.fillRect(T*0.13,y-h/2,w,h);
      g.fillStyle="rgba(0,183,228,.72)"; g.fillRect(T*0.57,y-h/2,w,h);
      trait(g,"#14120f",T*0.03);
      g.strokeRect(T*0.13,y-h/2,w,h); g.strokeRect(T*0.57,y-h/2,w,h);
      g.beginPath(); g.moveTo(T*0.43,y); g.lineTo(T*0.57,y); g.stroke();
    }},
  { n:"Moustache", d:function(g,T){
      g.fillStyle="#3a2416";
      g.beginPath();
      g.moveTo(T*0.5,T*0.44);
      g.bezierCurveTo(T*0.34,T*0.36, T*0.10,T*0.40, T*0.08,T*0.56);
      g.bezierCurveTo(T*0.22,T*0.66, T*0.40,T*0.60, T*0.5,T*0.52);
      g.bezierCurveTo(T*0.60,T*0.60, T*0.78,T*0.66, T*0.92,T*0.56);
      g.bezierCurveTo(T*0.90,T*0.40, T*0.66,T*0.36, T*0.5,T*0.44);
      g.closePath(); g.fill(); contour(g,T*0.018);
    }},
  { n:"Moustache fine", d:function(g,T){
      g.fillStyle="#14120f";
      g.beginPath();
      g.moveTo(T*0.5,T*0.46);
      g.bezierCurveTo(T*0.38,T*0.42, T*0.26,T*0.44, T*0.24,T*0.52);
      g.bezierCurveTo(T*0.34,T*0.54, T*0.44,T*0.52, T*0.5,T*0.50);
      g.bezierCurveTo(T*0.56,T*0.52, T*0.66,T*0.54, T*0.76,T*0.52);
      g.bezierCurveTo(T*0.74,T*0.44, T*0.62,T*0.42, T*0.5,T*0.46);
      g.closePath(); g.fill();
    }},
  { n:"Barbe", d:function(g,T){
      g.fillStyle="#4a2f1c";
      g.beginPath();
      g.moveTo(T*0.18,T*0.26);
      g.bezierCurveTo(T*0.16,T*0.70, T*0.34,T*0.94, T*0.5,T*0.94);
      g.bezierCurveTo(T*0.66,T*0.94, T*0.84,T*0.70, T*0.82,T*0.26);
      g.bezierCurveTo(T*0.70,T*0.42, T*0.62,T*0.46, T*0.5,T*0.46);
      g.bezierCurveTo(T*0.38,T*0.46, T*0.30,T*0.42, T*0.18,T*0.26);
      g.closePath(); g.fill(); contour(g,T*0.016);
      g.fillStyle="rgba(0,0,0,.18)";
      g.beginPath(); g.ellipse(T*0.5,T*0.50,T*0.13,T*0.07,0,0,Math.PI*2); g.fill();
    }},
  { n:"Haut-de-forme", d:function(g,T){
      g.fillStyle="#14120f";
      g.fillRect(T*0.28,T*0.14,T*0.44,T*0.52);
      g.beginPath(); g.ellipse(T*0.5,T*0.68,T*0.40,T*0.09,0,0,Math.PI*2); g.fill();
      g.fillStyle="#e01b24"; g.fillRect(T*0.28,T*0.52,T*0.44,T*0.10);
      contour(g,T*0.014);
      g.fillStyle="rgba(255,255,255,.10)"; g.fillRect(T*0.32,T*0.16,T*0.06,T*0.34);
    }},
  { n:"Casquette", d:function(g,T){
      g.fillStyle="#0055d4";                         // visiere d'un seul cote
      g.beginPath();
      g.moveTo(T*0.50,T*0.56);
      g.quadraticCurveTo(T*0.80,T*0.54, T*0.94,T*0.66);
      g.quadraticCurveTo(T*0.80,T*0.72, T*0.50,T*0.66);
      g.closePath();
      g.fillStyle="#003c96"; g.fill(); contour(g,T*0.014);
      g.fillStyle="#0055d4";
      g.beginPath(); g.arc(T*0.44,T*0.58,T*0.28,Math.PI,0); g.closePath(); g.fill();
      g.fillRect(T*0.16,T*0.56,T*0.56,T*0.06);
      contour(g,T*0.014);
      g.fillStyle="#f5f3ee"; g.beginPath(); g.arc(T*0.44,T*0.32,T*0.04,0,Math.PI*2); g.fill();
    }},
  { n:"Couronne", d:function(g,T){
      g.fillStyle="#ffd400";
      g.beginPath();
      g.moveTo(T*0.16,T*0.68); g.lineTo(T*0.16,T*0.30); g.lineTo(T*0.32,T*0.48);
      g.lineTo(T*0.5,T*0.22);  g.lineTo(T*0.68,T*0.48); g.lineTo(T*0.84,T*0.30);
      g.lineTo(T*0.84,T*0.68); g.closePath(); g.fill(); contour(g,T*0.02);
      ["#e01b24","#00b7e4","#8cc63f"].forEach(function(col,i){
        g.fillStyle=col;
        g.beginPath(); g.arc(T*(0.30+i*0.20), T*0.60, T*0.035, 0, Math.PI*2); g.fill();
      });
    }},
  { n:"Bonnet", d:function(g,T){
      g.fillStyle="#e01b24";
      g.beginPath(); g.arc(T*0.5,T*0.62,T*0.30,Math.PI,0); g.closePath(); g.fill();
      g.fillStyle="#f5f3ee"; g.fillRect(T*0.18,T*0.58,T*0.64,T*0.14);
      g.beginPath(); g.arc(T*0.5,T*0.28,T*0.08,0,Math.PI*2); g.fill();
      contour(g,T*0.014);
    }},
  { n:"Beret", d:function(g,T){
      g.fillStyle="#3b2a8c";
      g.beginPath(); g.ellipse(T*0.5,T*0.54,T*0.34,T*0.22,0,0,Math.PI*2); g.fill();
      g.fillStyle="#14120f"; g.fillRect(T*0.24,T*0.62,T*0.52,T*0.06);
      g.fillStyle="#3b2a8c";
      g.beginPath(); g.arc(T*0.62,T*0.32,T*0.045,0,Math.PI*2); g.fill();
      contour(g,T*0.012);
    }},
  { n:"Casque", d:function(g,T){
      g.fillStyle="#ffd400";
      g.beginPath(); g.arc(T*0.5,T*0.60,T*0.28,Math.PI,0); g.closePath(); g.fill();
      g.beginPath(); g.ellipse(T*0.5,T*0.62,T*0.42,T*0.08,0,0,Math.PI*2); g.fill();
      g.fillStyle="rgba(0,0,0,.18)"; g.fillRect(T*0.46,T*0.34,T*0.08,T*0.26);
      contour(g,T*0.014);
    }},
  { n:"Noeud papillon", d:function(g,T){
      g.fillStyle="#e01b24";
      g.beginPath();
      g.moveTo(T*0.5,T*0.5); g.lineTo(T*0.16,T*0.32); g.lineTo(T*0.16,T*0.68); g.closePath(); g.fill();
      g.beginPath();
      g.moveTo(T*0.5,T*0.5); g.lineTo(T*0.84,T*0.32); g.lineTo(T*0.84,T*0.68); g.closePath(); g.fill();
      g.fillStyle="#8e1319";
      g.beginPath(); g.ellipse(T*0.5,T*0.5,T*0.06,T*0.09,0,0,Math.PI*2); g.fill();
      contour(g,T*0.016);
    }},
  { n:"Nez de clown", d:function(g,T){
      var gr=g.createRadialGradient(T*0.44,T*0.44,T*0.02,T*0.5,T*0.5,T*0.26);
      gr.addColorStop(0,"#ff7a6e"); gr.addColorStop(1,"#d1200f");
      g.fillStyle=gr; g.beginPath(); g.arc(T*0.5,T*0.5,T*0.26,0,Math.PI*2); g.fill();
      g.fillStyle="rgba(255,255,255,.6)";
      g.beginPath(); g.arc(T*0.41,T*0.41,T*0.055,0,Math.PI*2); g.fill();
    }},
  { n:"Oreilles de chat", d:function(g,T){
      [[0.28,-1],[0.72,1]].forEach(function(p){
        g.fillStyle="#3a3a3a";
        g.beginPath();
        g.moveTo(T*p[0],T*0.22); g.lineTo(T*(p[0]-0.14),T*0.72); g.lineTo(T*(p[0]+0.14),T*0.72);
        g.closePath(); g.fill(); contour(g,T*0.016);
        g.fillStyle="#ff9ec4";
        g.beginPath();
        g.moveTo(T*p[0],T*0.34); g.lineTo(T*(p[0]-0.08),T*0.66); g.lineTo(T*(p[0]+0.08),T*0.66);
        g.closePath(); g.fill();
      });
    }},
  { n:"Cornes", d:function(g,T){
      g.fillStyle="#c0202a";
      [[0.34,-1],[0.66,1]].forEach(function(p){    // pointes vers le haut et l'exterieur
        var x=T*p[0], s=p[1];
        g.beginPath();
        g.moveTo(x-T*0.09*s, T*0.80);
        g.quadraticCurveTo(x-T*0.02*s, T*0.44, x+T*0.20*s, T*0.20);
        g.quadraticCurveTo(x+T*0.06*s, T*0.52, x+T*0.07*s, T*0.80);
        g.closePath(); g.fill(); contour(g,T*0.016);
      });
    }},
  { n:"Aureole", d:function(g,T){
      g.strokeStyle="#ffd400"; g.lineWidth=T*0.07;
      g.beginPath(); g.ellipse(T*0.5,T*0.5,T*0.32,T*0.12,0,0,Math.PI*2); g.stroke();
      g.strokeStyle="rgba(255,255,255,.55)"; g.lineWidth=T*0.02;
      g.beginPath(); g.ellipse(T*0.5,T*0.47,T*0.32,T*0.12,0,Math.PI*1.05,Math.PI*1.85); g.stroke();
    }},
  { n:"Cache-oeil", d:function(g,T){
      trait(g,"#14120f",T*0.05);
      g.beginPath(); g.moveTo(T*0.06,T*0.30); g.lineTo(T*0.94,T*0.40); g.stroke();
      g.fillStyle="#14120f";
      g.beginPath(); g.ellipse(T*0.5,T*0.55,T*0.22,T*0.18,0,0,Math.PI*2); g.fill();
      g.fillStyle="rgba(255,255,255,.10)";
      g.beginPath(); g.ellipse(T*0.44,T*0.49,T*0.07,T*0.05,0,0,Math.PI*2); g.fill();
    }},
  { n:"Cigare", d:function(g,T){
      g.fillStyle="#7a4b2a"; g.fillRect(T*0.22,T*0.46,T*0.52,T*0.10);
      g.fillStyle="#c9a06a"; g.fillRect(T*0.22,T*0.46,T*0.10,T*0.10);
      g.fillStyle="#3a3a3a"; g.fillRect(T*0.72,T*0.46,T*0.06,T*0.10);
      g.fillStyle="#ff6a00"; g.fillRect(T*0.76,T*0.47,T*0.04,T*0.08);
      g.strokeStyle="rgba(240,240,240,.55)"; g.lineWidth=T*0.018;
      g.beginPath();
      g.moveTo(T*0.82,T*0.44);
      g.quadraticCurveTo(T*0.90,T*0.34, T*0.84,T*0.24);
      g.quadraticCurveTo(T*0.78,T*0.16, T*0.88,T*0.08);
      g.stroke();
      contour(g,T*0.012);
    }},
  { n:"Sourire", d:function(g,T){
      g.fillStyle="#c0202a";
      g.beginPath(); g.arc(T*0.5,T*0.44,T*0.32,0,Math.PI); g.closePath(); g.fill();
      g.fillStyle="#f5f3ee";
      g.fillRect(T*0.18,T*0.44,T*0.64,T*0.13);
      g.strokeStyle="#c9c5b8"; g.lineWidth=T*0.012;
      for(var i=1;i<6;i++){
        g.beginPath(); g.moveTo(T*(0.18+i*0.1067),T*0.44); g.lineTo(T*(0.18+i*0.1067),T*0.57); g.stroke();
      }
      contour(g,T*0.014);
    }}
];

function visageCanvas(v, T){
  var c=document.createElement("canvas"); c.width=T; c.height=T;
  var g=c.getContext("2d");
  v.d(g,T);
  return c;
}

return { MOTS:MOTS, VISAGES:VISAGES, motCanvas:motCanvas, visageCanvas:visageCanvas };
})();
</script>
<script>
(function(){
"use strict";
var RTDB = "https://lumiia-live-default-rtdb.europe-west1.firebasedatabase.app";

var params = new URLSearchParams(location.search);
var salle  = (params.get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);

var scene=document.getElementById("scene"), vue=document.getElementById("vue"),
    vg=vue.getContext("2d"), vide=document.getElementById("vide"),
    etat=document.getElementById("etat"), coller=document.getElementById("coller"),
    retirer=document.getElementById("retirer"), champ=document.getElementById("fichier"),
    grille=document.getElementById("pastilles"), consigne=document.getElementById("consigne"),
    panRejoindre=document.getElementById("rejoindre");

var fond=null;          // miniature du mur
var objets={};          // tous les objets flottants de la salle
var miens={};           // ceux que CE telephone a envoyes
var choisi=null;        // identifiant de l'objet en cours de manipulation

/* --- les objets envoyes par ce telephone survivent a un rafraichissement --- */
try{
  var gard=localStorage.getItem("graffwall_miens_"+salle);
  if(gard) miens=JSON.parse(gard);
}catch(e){}
function noterMiens(){
  try{ localStorage.setItem("graffwall_miens_"+salle, JSON.stringify(miens)); }catch(e){}
}

function msg(t,c){ etat.textContent=t||""; etat.className=c||""; }

/* ---------------- saisie du code de salle ---------------- */
function demanderSalle(){ panRejoindre.classList.add("on"); }
document.getElementById("valider").addEventListener("click", function(){
  var v=document.getElementById("champSalle").value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
  if(v.length<3){ return; }
  location.search="?s="+v;
});
document.getElementById("salle").addEventListener("click", demanderSalle);
if(!salle){
  document.getElementById("salle").textContent="AUCUNE SALLE";
  demanderSalle();
  return;
}
document.getElementById("salle").textContent="SALLE "+salle;

/* ---------------- rendu ---------------- */
function taillerCanvas(){
  var r=scene.getBoundingClientRect();
  vue.width=Math.round(r.width); vue.height=Math.round(r.height);
  rendre();
}
function dims(o){
  var lp=vue.width*o.t;
  var hp = (o.type==="sticker"||!o.im) ? lp : lp*(o.im.height/o.im.width);
  return { lp:lp, hp:hp };
}
function poser(o, actif){
  var d=dims(o);
  vg.save();
  vg.globalAlpha=1;
  vg.translate(o.x*vue.width, o.y*vue.height); vg.rotate(o.r);
  if(o.type==="sticker"){
    vg.font=Math.round(d.lp)+"px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',system-ui,sans-serif";
    vg.textAlign="center"; vg.textBaseline="middle";
    vg.fillText(o.car||"?",0,0);
  } else if(o.im){
    if(!o.nue){
      var m=Math.max(2,d.lp*0.035);
      vg.fillStyle="#f6f4ec"; vg.fillRect(-d.lp/2-m,-d.hp/2-m,d.lp+m*2,d.hp+m*2);
    }
    vg.drawImage(o.im,-d.lp/2,-d.hp/2,d.lp,d.hp);
  }
  if(actif){
    vg.strokeStyle="rgba(200,255,30,.95)"; vg.lineWidth=2.5; vg.setLineDash([7,5]);
    vg.strokeRect(-d.lp/2-6,-d.hp/2-6,d.lp+12,d.hp+12);
  } else if(miens[o.id]){
    vg.strokeStyle="rgba(200,255,30,.35)"; vg.lineWidth=1.5; vg.setLineDash([4,4]);
    vg.strokeRect(-d.lp/2-4,-d.hp/2-4,d.lp+8,d.hp+8);
  }
  vg.restore();
}
var listeConnue="";
function majListe(){
  var bande=document.getElementById("mesObjets");
  var ids=Object.keys(objets).filter(function(i){ return miens[i]; });
  var cle=ids.join(",")+"|"+choisi;
  if(cle===listeConnue) return;
  listeConnue=cle;
  bande.innerHTML="";
  bande.classList.toggle("on", ids.length>0);
  ids.forEach(function(id){
    var o=objets[id], b=document.createElement("button");
    b.setAttribute("aria-current", id===choisi ? "true":"false");
    if(o.im){ var i=new Image(); i.src=o.im.src; b.appendChild(i); }
    b.addEventListener("click", function(){ choisi=id; rendre(); });
    bande.appendChild(b);
  });
}
function rendre(){
  vg.clearRect(0,0,vue.width,vue.height);
  if(fond) vg.drawImage(fond,0,0,vue.width,vue.height);
  for(var id in objets) if(id!==choisi) poser(objets[id], false);
  if(choisi && objets[choisi]) poser(objets[choisi], true);
  vide.style.display = fond ? "none" : "flex";
  var n=Object.keys(objets).length;
  consigne.textContent = choisi ? "Un doigt pour déplacer · deux doigts pour agrandir et tourner"
                       : (n ? "Touche un de tes objets pour le reprendre" : "Envoie une photo ou une pastille");
  coller.disabled = !choisi; retirer.disabled = !choisi;
  majListe();
}

/* ---------------- selection et manipulation ---------------- */
function local(e){
  var r=scene.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height };
}
function viser(p){
  var ids=Object.keys(objets), i, id, o, d, dx, dy, ca, sa, lx, ly;
  for(i=ids.length-1;i>=0;i--){                 // du plus recent au plus ancien
    id=ids[i]; o=objets[id];
    if(!miens[id]) continue;                    // on ne reprend que ses propres objets
    d=dims(o);
    dx=(p.x-o.x)*vue.width; dy=(p.y-o.y)*vue.height;
    ca=Math.cos(-o.r); sa=Math.sin(-o.r);
    lx=dx*ca-dy*sa; ly=dx*sa+dy*ca;
    if(Math.abs(lx)<=d.lp/2+10 && Math.abs(ly)<=d.hp/2+10) return id;
  }
  return null;
}
var doigts={}, depart=null;
function pts(){ var a=[]; for(var k in doigts) a.push(doigts[k]); return a; }
function centre(a){ return { x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2 }; }
function ecart(a){ return Math.hypot(a[1].x-a[0].x, a[1].y-a[0].y); }
function angle(a){ return Math.atan2(a[1].y-a[0].y, a[1].x-a[0].x); }
function ancrer(){
  var a=pts(), o=objets[choisi];
  if(!o || !a.length){ depart=null; return; }
  depart={ x:o.x, y:o.y, t:o.t, r:o.r,
           p:a.length>1?centre(a):a[0],
           d:a.length>1?ecart(a):0, ang:a.length>1?angle(a):0 };
}
scene.addEventListener("pointerdown", function(e){
  var p=local(e);
  if(!Object.keys(doigts).length){
    var vise=viser(p);
    if(vise) choisi=vise;
    else if(!choisi) { rendre(); return; }
  }
  scene.setPointerCapture && scene.setPointerCapture(e.pointerId);
  doigts[e.pointerId]=p; ancrer(); rendre();
});
scene.addEventListener("pointermove", function(e){
  if(!doigts[e.pointerId] || !choisi || !depart) return;
  doigts[e.pointerId]=local(e);
  var a=pts(), o=objets[choisi];
  if(a.length>1){
    var c=centre(a), d=ecart(a), g=angle(a);
    if(depart.d>0.001){
      o.t=Math.max(.04, Math.min(1.6, depart.t*(d/depart.d)));
      o.r=depart.r+(g-depart.ang);
    }
    o.x=depart.x+(c.x-depart.p.x); o.y=depart.y+(c.y-depart.p.y);
  } else {
    o.x=depart.x+(a[0].x-depart.p.x); o.y=depart.y+(a[0].y-depart.p.y);
  }
  o.x=Math.max(-.2,Math.min(1.2,o.x)); o.y=Math.max(-.2,Math.min(1.2,o.y));
  rendre(); pousser();
});
function relache(e){
  delete doigts[e.pointerId];
  ancrer(); pousser(true);
}
scene.addEventListener("pointerup", relache);
scene.addEventListener("pointercancel", relache);

/* ---------------- echanges avec le mur ---------------- */
var dernier=0, attente=false;
function pousser(force){
  var o=objets[choisi]; if(!o) return;
  var m=Date.now();
  if(!force && m-dernier<300){ attente=true; return; }
  dernier=m; attente=false;
  fetch(RTDB+"/graffwall/envois/"+salle+"/pos/"+o.id+".json",{
    method:"PUT",
    body: JSON.stringify({ x:o.x, y:o.y, t:o.t, r:o.r, colle:0, ts:m })
  }).catch(function(){});
}
setInterval(function(){ if(attente) pousser(true); }, 320);

function chargerObjet(id, d){
  fetch(RTDB+"/graffwall/envois/"+salle+"/objets/"+id+".json")
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(ob){
      if(!ob) return;
      var o={ id:id, type:ob.type, car:ob.car, nue:ob.nue, im:null, x:d.x, y:d.y, t:d.t, r:d.r };
      if(ob.type==="sticker"){ objets[id]=o; rendre(); return; }
      var im=new Image();
      im.onload=function(){ o.im=im; objets[id]=o; rendre(); };
      im.src=ob.img;
    }).catch(function(){});
}
function relever(){
  fetch(RTDB+"/graffwall/envois/"+salle+"/pos.json")
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(p){
      p=p||{};
      for(var id in p){
        if(!objets[id]){ chargerObjet(id, p[id]); continue; }
        if(id===choisi && Object.keys(doigts).length) continue;   // ne pas contrarier le doigt
        var o=objets[id], d=p[id];
        o.x=d.x; o.y=d.y; o.t=d.t; o.r=d.r;
      }
      for(var k in objets) if(!p[k]){
        delete objets[k];
        if(choisi===k) choisi=null;
      }
      rendre();
    }).catch(function(){});
}
function releverVue(){
  fetch(RTDB+"/graffwall/envois/"+salle+"/vue.json")
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(d){
      if(!d) return;
      var im=new Image();
      im.onload=function(){ fond=im; rendre(); };
      im.src=d;
    }).catch(function(){});
}
relever(); releverVue();
setInterval(relever, 700);
setInterval(releverVue, 2200);

/* ---------------- creation ---------------- */
function nouvelId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function deposer(contenu, o){
  objets[o.id]=o; miens[o.id]=1; noterMiens(); choisi=o.id; rendre();
  return fetch(RTDB+"/graffwall/envois/"+salle+"/objets/"+o.id+".json",
               { method:"PUT", body:JSON.stringify(contenu) })
    .then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error(r.status+" "+t.slice(0,50)); });
      pousser(true);
    });
}

champ.addEventListener("change", function(){
  var f=champ.files && champ.files[0];
  if(!f) return;
  msg("Préparation…");
  var lect=new FileReader();
  lect.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1100, r=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement("canvas");
      c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      var dURL=c.toDataURL("image/jpeg",.72);
      var im=new Image();
      im.onload=function(){
        var o={ id:nouvelId(), type:"photo", im:im, x:.5, y:.45, t:.3, r:0 };
        msg("Envoi…");
        deposer({ type:"photo", img:dURL }, o)
          .then(function(){ msg("Cadre puis colle","ok"); })
          .catch(function(e){ msg("Échec : "+e.message,"ko"); delete objets[o.id]; choisi=null; rendre(); });
      };
      im.src=dURL;
    };
    img.onerror=function(){ msg("Image illisible","ko"); };
    img.src=lect.result;
  };
  lect.readAsDataURL(f);
  champ.value="";
});

var EMOJIS=("😀 😎 🤩 🥳 😍 🤪 👽 🤖 👻 💀 👑 🔥 💥 ⚡ ✨ ⭐ 🌈 ☀️ 🌙 ☁️ 💧 🌊 🍀 🌸 🌵 🎨 🖌️ 🎧 🎸 🎤 📸 🎯 🏆 🎁 🎉 🎈 🍕 🍔 🍩 🍺 ❤️ 💜 💚 💙 🧡 ⚽ 🚀 🛹 🕶️ 🦄 🐱 🐶 🦋 🐝 🦖 ✌️ 👍 🤘 👊 💯 ❗ ❓ 💬").split(" ");
/* Le telephone dessine lui-meme la pastille et l'envoie comme image. Les
   polices emoji couleur sont garanties sur mobile, pas sur le poste du mur :
   en envoyant le caractere, certains glyphes y ressortaient en contour pale.
   En envoyant un rendu, ce qu'on voit sur le telephone est ce qui s'affiche. */
function pastilleEnImage(car){
  var T=320, c=document.createElement("canvas");
  c.width=T; c.height=T;
  var g=c.getContext("2d");
  g.font=Math.round(T*0.78)+"px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
  g.textAlign="center"; g.textBaseline="middle";
  g.fillText(car, T/2, T*0.54);
  return c.toDataURL("image/png");
}
/* Envoi commun a toutes les pastilles : on transmet un rendu, jamais un
   caractere ni un fichier — ce qui s'affiche ici s'affiche sur le mur. */
function envoyerPastille(dURL, tailleDepart){
  grille.classList.remove("on");
  document.getElementById("onglets").style.display="none";
  var im=new Image();
  im.onload=function(){
    var o={ id:nouvelId(), type:"photo", nue:1, im:im, x:.5, y:.45, t:tailleDepart, r:0 };
    msg("Envoi…");
    deposer({ type:"photo", nue:1, img:dURL }, o)
      .then(function(){ msg("Place puis colle","ok"); })
      .catch(function(e){ msg("Échec : "+e.message,"ko"); delete objets[o.id]; choisi=null; rendre(); });
  };
  im.src=dURL;
}
function vignette(canvasSource){
  var v=document.createElement("canvas");
  var r=110/Math.max(canvasSource.width, canvasSource.height);
  v.width=Math.round(canvasSource.width*r); v.height=Math.round(canvasSource.height*r);
  v.getContext("2d").drawImage(canvasSource,0,0,v.width,v.height);
  return v.toDataURL("image/png");
}
var ongletCourant="";
function remplirGrille(nom){
  if(ongletCourant===nom) return;
  ongletCourant=nom;
  grille.innerHTML="";
  grille.classList.toggle("large", nom!=="emoji");
  [].forEach.call(document.querySelectorAll("#onglets .btn"), function(b){
    b.setAttribute("aria-current", b.dataset.onglet===nom ? "true":"false");
  });
  if(nom==="emoji"){
    EMOJIS.forEach(function(c){
      var b=document.createElement("button");
      b.textContent=c;
      b.addEventListener("click", function(){ envoyerPastille(pastilleEnImage(c), .14); });
      grille.appendChild(b);
    });
  } else if(nom==="mot"){
    PASTILLES.MOTS.forEach(function(m){
      var b=document.createElement("button"), i=new Image();
      i.src=vignette(PASTILLES.motCanvas(m, 300));
      b.appendChild(i);
      b.addEventListener("click", function(){
        envoyerPastille(PASTILLES.motCanvas(m, 900).toDataURL("image/png"), .30);
      });
      grille.appendChild(b);
    });
  } else {
    PASTILLES.VISAGES.forEach(function(v){
      var b=document.createElement("button"), i=new Image();
      i.src=vignette(PASTILLES.visageCanvas(v, 220));
      b.appendChild(i);
      b.addEventListener("click", function(){
        envoyerPastille(PASTILLES.visageCanvas(v, 640).toDataURL("image/png"), .20);
      });
      grille.appendChild(b);
    });
  }
}
document.getElementById("onglets").addEventListener("click", function(e){
  var b=e.target.closest ? e.target.closest("[data-onglet]") : null;
  if(b) remplirGrille(b.dataset.onglet);
});
document.getElementById("ouvrirPastilles").addEventListener("click", function(){
  var ouvert=grille.classList.toggle("on");
  document.getElementById("onglets").style.display = ouvert ? "flex" : "none";
  if(ouvert && !ongletCourant) remplirGrille("emoji");
});

var confirmeColle=null;
coller.addEventListener("click", function(){
  var o=objets[choisi]; if(!o) return;
  if(confirmeColle!==o.id){                      // premier appui : on previent
    confirmeColle=o.id;
    coller.querySelector("span").textContent=" Confirmer — définitif";
    msg("Une fois collé, l'objet ne se déplace plus","ko");
    setTimeout(function(){
      if(confirmeColle===o.id){ confirmeColle=null; coller.querySelector("span").textContent=" Coller sur le mur"; msg(""); }
    }, 4000);
    return;
  }
  confirmeColle=null; coller.querySelector("span").textContent=" Coller sur le mur";
  coller.disabled=true;
  fetch(RTDB+"/graffwall/envois/"+salle+"/pos/"+o.id+".json",{
    method:"PUT",
    body: JSON.stringify({ x:o.x, y:o.y, t:o.t, r:o.r, colle:1, ts:Date.now() })
  }).then(function(){
    delete objets[o.id]; delete miens[o.id]; noterMiens(); choisi=null;
    msg("Collé sur le mur","ok"); rendre();
  }).catch(function(e){ msg("Échec : "+e.message,"ko"); coller.disabled=false; });
});
retirer.addEventListener("click", function(){
  var o=objets[choisi]; if(!o) return;
  var id=o.id;
  fetch(RTDB+"/graffwall/envois/"+salle+"/pos/"+id+".json",{method:"DELETE"}).catch(function(){});
  fetch(RTDB+"/graffwall/envois/"+salle+"/objets/"+id+".json",{method:"DELETE"}).catch(function(){});
  delete objets[id]; delete miens[id]; noterMiens(); choisi=null;
  msg("Retiré"); rendre();
});

window.addEventListener("resize", taillerCanvas);
taillerCanvas();
})();
</script>
