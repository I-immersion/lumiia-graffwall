<!DOCTYPE html>
<!-- LUMIIA MUR DE GRAFF — PHOTO v4.2 — page mobile, envoi d'une photo sur le mur -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131209">
<title>LUMIIA — Envoyer une photo</title>
<style>
  :root{ --fond:#131209; --trace:#f2f0e6; --acid:#c8ff1e; --rouille:#d1441f; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--fond);color:var(--trace);min-height:100svh;
    font-family:system-ui,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:26px 20px 40px;gap:20px;text-align:center;
  }
  h1{
    font-family:Impact,Haettenschweiler,"Arial Narrow",sans-serif;font-weight:400;
    font-size:30px;letter-spacing:.01em;text-transform:uppercase;transform:skewX(-7deg);
  }
  h1 span{color:var(--acid)}
  #salle{
    font-size:12px;letter-spacing:.24em;color:rgba(242,240,230,.45);font-weight:700;
    text-transform:uppercase;
  }
  #apercu{
    width:100%;max-width:460px;aspect-ratio:4/3;border-radius:14px;
    border:2px dashed rgba(242,240,230,.22);background:#1c1b13;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    color:rgba(242,240,230,.35);font-size:15px;
  }
  #apercu img{width:100%;height:100%;object-fit:cover;display:block}
  .btn{
    width:100%;max-width:460px;border:0;border-radius:13px;padding:20px;
    font-size:18px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:11px;
  }
  .btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  #prendre{background:var(--trace);color:#16150f}
  #envoyer{background:var(--acid);color:#16150f}
  #envoyer[disabled]{opacity:.3}
  #etat{font-size:15px;min-height:24px;letter-spacing:.03em}
  #etat.ok{color:var(--acid)} #etat.ko{color:#f0907a}
  .aide{font-size:13px;color:rgba(242,240,230,.4);line-height:1.6;max-width:420px}
  input[type=file]{display:none}
</style>
</head>
<body>

<h1><span>LUMIIA</span><br>Mur de Graff</h1>
<div id="salle">salle —</div>

<div id="apercu">Aucune photo</div>

<label class="btn" id="prendre" for="fichier">
  <svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="4"/></svg>
  Prendre une photo
</label>
<input type="file" id="fichier" accept="image/*" capture="environment">

<button class="btn" id="envoyer" disabled>
  <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6z"/></svg>
  Envoyer sur le mur
</button>

<div id="etat"></div>
<p class="aide">La photo s'affiche sur le mur géant, où elle peut être peinte
et recouverte. Elle n'est pas conservée après l'affichage.</p>

<script>
(function(){
"use strict";
var RTDB = "https://lumiia-live-default-rtdb.europe-west1.firebasedatabase.app";

var params = new URLSearchParams(location.search);
var salle  = (params.get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);

var apercu=document.getElementById("apercu"), champ=document.getElementById("fichier"),
    envoyer=document.getElementById("envoyer"), etat=document.getElementById("etat");
var dataURL=null;

document.getElementById("salle").textContent = salle ? ("salle "+salle) : "aucune salle";
if(!salle){
  message("Lien incomplet — rescanne le code affiché sur le mur.","ko");
  document.getElementById("prendre").style.opacity=".3";
}

function message(t,c){ etat.textContent=t; etat.className=c||""; }

/* La photo est reduite avant l'envoi : un cliche de telephone pese plusieurs
   megaoctets, inutile pour un collage qui occupera un tiers de l'ecran. */
function reduire(fichier){
  return new Promise(function(res,rej){
    var lect=new FileReader();
    lect.onerror=function(){ rej(new Error("lecture impossible")); };
    lect.onload=function(){
      var img=new Image();
      img.onerror=function(){ rej(new Error("image illisible")); };
      img.onload=function(){
        var max=1100, r=Math.min(1, max/Math.max(img.width,img.height));
        var c=document.createElement("canvas");
        c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
        var g=c.getContext("2d");
        g.imageSmoothingQuality="high";
        g.drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",.72));
      };
      img.src=lect.result;
    };
    lect.readAsDataURL(fichier);
  });
}

champ.addEventListener("change", function(){
  var f=champ.files && champ.files[0];
  if(!f) return;
  message("Préparation…");
  reduire(f).then(function(d){
    dataURL=d;
    apercu.innerHTML='<img alt="" src="'+d+'">';
    envoyer.disabled=false;
    message(Math.round(d.length/1365)+" Ko prêts à partir");
  }).catch(function(e){
    message("Photo illisible : "+e.message,"ko");
  });
});

envoyer.addEventListener("click", function(){
  if(!dataURL || !salle) return;
  envoyer.disabled=true;
  message("Envoi…");
  var id = Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  fetch(RTDB+"/graffwall/envois/"+salle+"/"+id+".json", {
    method:"PUT",
    body: JSON.stringify({ ts:Date.now(), img:dataURL })
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(r.status+" "+t.slice(0,60)); });
    message("Envoyée — regarde le mur","ok");
    dataURL=null;
    apercu.innerHTML="Aucune photo";
    setTimeout(function(){ message("Tu peux en envoyer une autre"); },3500);
  }).catch(function(e){
    envoyer.disabled=false;
    message("Échec : "+e.message,"ko");
  });
});
})();
</script>
</body>
</html>
