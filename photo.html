<!DOCTYPE html>
<!-- LUMIIA MUR DE GRAFF — PHOTO v4.5 — cadrage tactile depuis le telephone -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#131209">
<title>LUMIIA — Envoyer sur le mur</title>
<style>
  :root{ --fond:#131209; --trace:#f2f0e6; --acid:#c8ff1e; --rouille:#d1441f; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--fond);color:var(--trace);
    font-family:system-ui,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:12px 12px 16px;gap:9px;user-select:none;
  }
  header{display:flex;align-items:baseline;gap:10px;width:100%;max-width:520px}
  h1{
    font-family:Impact,Haettenschweiler,"Arial Narrow",sans-serif;font-weight:400;
    font-size:20px;text-transform:uppercase;transform:skewX(-7deg);letter-spacing:.01em;
  }
  h1 span{color:var(--acid)}
  #salle{font-size:11px;letter-spacing:.22em;color:rgba(242,240,230,.45);font-weight:700;margin-left:auto;cursor:pointer}

  #scene{
    position:relative;width:100%;max-width:520px;aspect-ratio:16/9;
    border-radius:12px;overflow:hidden;background:#000;
    border:2px solid rgba(242,240,230,.16);touch-action:none;
  }
  #scene canvas{position:absolute;inset:0;width:100%;height:100%}
  #vide{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:rgba(242,240,230,.35);font-size:14px;text-align:center;padding:20px;
  }
  #consigne{
    position:absolute;left:0;right:0;bottom:0;padding:7px;text-align:center;
    background:linear-gradient(transparent,rgba(0,0,0,.78));font-size:12px;
    color:rgba(242,240,230,.85);letter-spacing:.02em;
  }

  .rangee{display:flex;gap:8px;width:100%;max-width:520px}
  .btn{
    flex:1;border:0;border-radius:11px;padding:15px 8px;
    font-size:14px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
    background:#2c2921;color:var(--trace);
  }
  .btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .btn.clair{background:var(--trace);color:#16150f}
  .btn.vif{background:var(--acid);color:#16150f}
  .btn.rouge{background:#3a1c12;color:#eab5a5}
  .btn[disabled]{opacity:.3}
  .btn.mince{flex:0 0 62px;padding:15px 0}

  #pastilles{
    display:none;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;max-width:520px;
    max-height:32vh;overflow-y:auto;padding:5px;
    background:#1c1b13;border-radius:12px;border:2px solid rgba(242,240,230,.12);
  }
  #pastilles.on{display:grid}
  #pastilles button{border:0;background:#26241a;border-radius:9px;padding:8px 0;font-size:26px;cursor:pointer;line-height:1.1}
  #pastilles button:active{background:var(--acid)}
  #etat{font-size:13px;min-height:18px;letter-spacing:.03em;text-align:center}
  #etat.ok{color:var(--acid)} #etat.ko{color:#f0907a}
  input[type=file]{display:none}

  #rejoindre{
    position:fixed;inset:0;background:rgba(10,9,6,.96);z-index:20;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:26px;
  }
  #rejoindre.on{display:flex}
  #rejoindre input{
    width:230px;padding:16px;border-radius:11px;border:2px solid rgba(242,240,230,.25);
    background:#1c1b13;color:var(--acid);font:800 30px/1 ui-monospace,Menlo,monospace;
    text-align:center;letter-spacing:.3em;text-transform:uppercase;
  }
  #rejoindre p{font-size:14px;color:rgba(242,240,230,.6);text-align:center;max-width:330px;line-height:1.6}
</style>
</head>
<body>

<header>
  <h1><span>LUMIIA</span> Mur de Graff</h1>
  <div id="salle">—</div>
</header>

<div id="scene">
  <canvas id="vue"></canvas>
  <div id="vide">Le mur apparaîtra ici</div>
  <div id="consigne">Touche un objet pour le reprendre</div>
</div>

<div class="rangee">
  <label class="btn clair" for="fichier">
    <svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="4"/></svg>
    Photo
  </label>
  <input type="file" id="fichier" accept="image/*" capture="environment">
  <button class="btn" id="ouvrirPastilles">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/></svg>
    Pastilles
  </button>
</div>

<div id="pastilles"></div>

<div class="rangee">
  <button class="btn vif" id="coller" disabled>
    <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
    Coller sur le mur
  </button>
  <button class="btn rouge mince" id="retirer" disabled>
    <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
</div>

<div id="etat"></div>

<div id="rejoindre">
  <h1><span>LUMIIA</span> Mur de Graff</h1>
  <p>Saisis le code affiché sous le QR code du mur.</p>
  <input id="champSalle" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="····">
  <button class="btn vif" id="valider" style="max-width:230px">Rejoindre</button>
</div>

<script>
(function(){
"use strict";
var RTDB = "https://lumiia-live-default-rtdb.europe-west1.firebasedatabase.app";

var params = new URLSearchParams(location.search);
var salle  = (params.get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);

var scene=document.getElementById("scene"), vue=document.getElementById("vue"),
    vg=vue.getContext("2d"), vide=document.getElementById("vide"),
    etat=document.getElementById("etat"), coller=document.getElementById("coller"),
    retirer=document.getElementById("retirer"), champ=document.getElementById("fichier"),
    grille=document.getElementById("pastilles"), consigne=document.getElementById("consigne"),
    panRejoindre=document.getElementById("rejoindre");

var fond=null;          // miniature du mur
var objets={};          // tous les objets flottants de la salle
var miens={};           // ceux que CE telephone a envoyes
var choisi=null;        // identifiant de l'objet en cours de manipulation

/* --- les objets envoyes par ce telephone survivent a un rafraichissement --- */
try{
  var gard=localStorage.getItem("graffwall_miens_"+salle);
  if(gard) miens=JSON.parse(gard);
}catch(e){}
function noterMiens(){
  try{ localStorage.setItem("graffwall_miens_"+salle, JSON.stringify(miens)); }catch(e){}
}

function msg(t,c){ etat.textContent=t||""; etat.className=c||""; }

/* ---------------- saisie du code de salle ---------------- */
function demanderSalle(){ panRejoindre.classList.add("on"); }
document.getElementById("valider").addEventListener("click", function(){
  var v=document.getElementById("champSalle").value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
  if(v.length<3){ return; }
  location.search="?s="+v;
});
document.getElementById("salle").addEventListener("click", demanderSalle);
if(!salle){
  document.getElementById("salle").textContent="AUCUNE SALLE";
  demanderSalle();
  return;
}
document.getElementById("salle").textContent="SALLE "+salle;

/* ---------------- rendu ---------------- */
function taillerCanvas(){
  var r=scene.getBoundingClientRect();
  vue.width=Math.round(r.width); vue.height=Math.round(r.height);
  rendre();
}
function dims(o){
  var lp=vue.width*o.t;
  var hp = (o.type==="sticker"||!o.im) ? lp : lp*(o.im.height/o.im.width);
  return { lp:lp, hp:hp };
}
function poser(o, actif){
  var d=dims(o);
  vg.save();
  vg.globalAlpha=1;
  vg.translate(o.x*vue.width, o.y*vue.height); vg.rotate(o.r);
  if(o.type==="sticker"){
    vg.font=Math.round(d.lp)+"px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',system-ui,sans-serif";
    vg.textAlign="center"; vg.textBaseline="middle";
    vg.fillText(o.car||"?",0,0);
  } else if(o.im){
    var m=Math.max(2,d.lp*0.035);
    vg.fillStyle="#f6f4ec"; vg.fillRect(-d.lp/2-m,-d.hp/2-m,d.lp+m*2,d.hp+m*2);
    vg.drawImage(o.im,-d.lp/2,-d.hp/2,d.lp,d.hp);
  }
  if(actif){
    vg.strokeStyle="rgba(200,255,30,.95)"; vg.lineWidth=2.5; vg.setLineDash([7,5]);
    vg.strokeRect(-d.lp/2-6,-d.hp/2-6,d.lp+12,d.hp+12);
  } else if(miens[o.id]){
    vg.strokeStyle="rgba(200,255,30,.35)"; vg.lineWidth=1.5; vg.setLineDash([4,4]);
    vg.strokeRect(-d.lp/2-4,-d.hp/2-4,d.lp+8,d.hp+8);
  }
  vg.restore();
}
function rendre(){
  vg.clearRect(0,0,vue.width,vue.height);
  if(fond) vg.drawImage(fond,0,0,vue.width,vue.height);
  for(var id in objets) if(id!==choisi) poser(objets[id], false);
  if(choisi && objets[choisi]) poser(objets[choisi], true);
  vide.style.display = fond ? "none" : "flex";
  var n=Object.keys(objets).length;
  consigne.textContent = choisi ? "Un doigt pour déplacer · deux doigts pour agrandir et tourner"
                       : (n ? "Touche un de tes objets pour le reprendre" : "Envoie une photo ou une pastille");
  coller.disabled = !choisi; retirer.disabled = !choisi;
}

/* ---------------- selection et manipulation ---------------- */
function local(e){
  var r=scene.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height };
}
function viser(p){
  var ids=Object.keys(objets), i, id, o, d, dx, dy, ca, sa, lx, ly;
  for(i=ids.length-1;i>=0;i--){                 // du plus recent au plus ancien
    id=ids[i]; o=objets[id];
    if(!miens[id]) continue;                    // on ne reprend que ses propres objets
    d=dims(o);
    dx=(p.x-o.x)*vue.width; dy=(p.y-o.y)*vue.height;
    ca=Math.cos(-o.r); sa=Math.sin(-o.r);
    lx=dx*ca-dy*sa; ly=dx*sa+dy*ca;
    if(Math.abs(lx)<=d.lp/2+10 && Math.abs(ly)<=d.hp/2+10) return id;
  }
  return null;
}
var doigts={}, depart=null;
function pts(){ var a=[]; for(var k in doigts) a.push(doigts[k]); return a; }
function centre(a){ return { x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2 }; }
function ecart(a){ return Math.hypot(a[1].x-a[0].x, a[1].y-a[0].y); }
function angle(a){ return Math.atan2(a[1].y-a[0].y, a[1].x-a[0].x); }
function ancrer(){
  var a=pts(), o=objets[choisi];
  if(!o || !a.length){ depart=null; return; }
  depart={ x:o.x, y:o.y, t:o.t, r:o.r,
           p:a.length>1?centre(a):a[0],
           d:a.length>1?ecart(a):0, ang:a.length>1?angle(a):0 };
}
scene.addEventListener("pointerdown", function(e){
  var p=local(e);
  if(!Object.keys(doigts).length){
    var vise=viser(p);
    if(vise) choisi=vise;
    else if(!choisi) { rendre(); return; }
  }
  scene.setPointerCapture && scene.setPointerCapture(e.pointerId);
  doigts[e.pointerId]=p; ancrer(); rendre();
});
scene.addEventListener("pointermove", function(e){
  if(!doigts[e.pointerId] || !choisi || !depart) return;
  doigts[e.pointerId]=local(e);
  var a=pts(), o=objets[choisi];
  if(a.length>1){
    var c=centre(a), d=ecart(a), g=angle(a);
    if(depart.d>0.001){
      o.t=Math.max(.04, Math.min(1.6, depart.t*(d/depart.d)));
      o.r=depart.r+(g-depart.ang);
    }
    o.x=depart.x+(c.x-depart.p.x); o.y=depart.y+(c.y-depart.p.y);
  } else {
    o.x=depart.x+(a[0].x-depart.p.x); o.y=depart.y+(a[0].y-depart.p.y);
  }
  o.x=Math.max(-.2,Math.min(1.2,o.x)); o.y=Math.max(-.2,Math.min(1.2,o.y));
  rendre(); pousser();
});
function relache(e){
  delete doigts[e.pointerId];
  ancrer(); pousser(true);
}
scene.addEventListener("pointerup", relache);
scene.addEventListener("pointercancel", relache);

/* ---------------- echanges avec le mur ---------------- */
var dernier=0, attente=false;
function pousser(force){
  var o=objets[choisi]; if(!o) return;
  var m=Date.now();
  if(!force && m-dernier<300){ attente=true; return; }
  dernier=m; attente=false;
  fetch(RTDB+"/graffwall/envois/"+salle+"/pos/"+o.id+".json",{
    method:"PUT",
    body: JSON.stringify({ x:o.x, y:o.y, t:o.t, r:o.r, colle:0, ts:m })
  }).catch(function(){});
}
setInterval(function(){ if(attente) pousser(true); }, 320);

function chargerObjet(id, d){
  fetch(RTDB+"/graffwall/envois/"+salle+"/objets/"+id+".json")
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(ob){
      if(!ob) return;
      var o={ id:id, type:ob.type, car:ob.car, im:null, x:d.x, y:d.y, t:d.t, r:d.r };
      if(ob.type==="sticker"){ objets[id]=o; rendre(); return; }
      var im=new Image();
      im.onload=function(){ o.im=im; objets[id]=o; rendre(); };
      im.src=ob.img;
    }).catch(function(){});
}
function relever(){
  fetch(RTDB+"/graffwall/envois/"+salle+"/pos.json")
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(p){
      p=p||{};
      for(var id in p){
        if(!objets[id]){ chargerObjet(id, p[id]); continue; }
        if(id===choisi && Object.keys(doigts).length) continue;   // ne pas contrarier le doigt
        var o=objets[id], d=p[id];
        o.x=d.x; o.y=d.y; o.t=d.t; o.r=d.r;
      }
      for(var k in objets) if(!p[k]){
        delete objets[k];
        if(choisi===k) choisi=null;
      }
      rendre();
    }).catch(function(){});
}
function releverVue(){
  fetch(RTDB+"/graffwall/envois/"+salle+"/vue.json")
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(d){
      if(!d) return;
      var im=new Image();
      im.onload=function(){ fond=im; rendre(); };
      im.src=d;
    }).catch(function(){});
}
relever(); releverVue();
setInterval(relever, 700);
setInterval(releverVue, 2200);

/* ---------------- creation ---------------- */
function nouvelId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function deposer(contenu, o){
  objets[o.id]=o; miens[o.id]=1; noterMiens(); choisi=o.id; rendre();
  return fetch(RTDB+"/graffwall/envois/"+salle+"/objets/"+o.id+".json",
               { method:"PUT", body:JSON.stringify(contenu) })
    .then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error(r.status+" "+t.slice(0,50)); });
      pousser(true);
    });
}

champ.addEventListener("change", function(){
  var f=champ.files && champ.files[0];
  if(!f) return;
  msg("Préparation…");
  var lect=new FileReader();
  lect.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1100, r=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement("canvas");
      c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      var dURL=c.toDataURL("image/jpeg",.72);
      var im=new Image();
      im.onload=function(){
        var o={ id:nouvelId(), type:"photo", im:im, x:.5, y:.45, t:.3, r:0 };
        msg("Envoi…");
        deposer({ type:"photo", img:dURL }, o)
          .then(function(){ msg("Cadre puis colle","ok"); })
          .catch(function(e){ msg("Échec : "+e.message,"ko"); delete objets[o.id]; choisi=null; rendre(); });
      };
      im.src=dURL;
    };
    img.onerror=function(){ msg("Image illisible","ko"); };
    img.src=lect.result;
  };
  lect.readAsDataURL(f);
  champ.value="";
});

var EMOJIS=("😀 😎 🤩 🥳 😍 🤪 👽 🤖 👻 💀 👑 🔥 💥 ⚡ ✨ ⭐ 🌈 ☀️ 🌙 ☁️ 💧 🌊 🍀 🌸 🌵 🎨 🖌️ 🎧 🎸 🎤 📸 🎯 🏆 🎁 🎉 🎈 🍕 🍔 🍩 🍺 ❤️ 💜 💚 💙 🧡 ⚽ 🚀 🛹 🕶️ 🦄 🐱 🐶 🦋 🐝 🦖 ✌️ 👍 🤘 👊 💯 ❗ ❓ 💬").split(" ");
EMOJIS.forEach(function(c){
  var b=document.createElement("button");
  b.textContent=c;
  b.addEventListener("click", function(){
    grille.classList.remove("on");
    var o={ id:nouvelId(), type:"sticker", car:c, x:.5, y:.45, t:.12, r:0 };
    msg("Envoi…");
    deposer({ type:"sticker", car:c }, o)
      .then(function(){ msg("Place puis colle","ok"); })
      .catch(function(e){ msg("Échec : "+e.message,"ko"); delete objets[o.id]; choisi=null; rendre(); });
  });
  grille.appendChild(b);
});
document.getElementById("ouvrirPastilles").addEventListener("click", function(){ grille.classList.toggle("on"); });

coller.addEventListener("click", function(){
  var o=objets[choisi]; if(!o) return;
  coller.disabled=true;
  fetch(RTDB+"/graffwall/envois/"+salle+"/pos/"+o.id+".json",{
    method:"PUT",
    body: JSON.stringify({ x:o.x, y:o.y, t:o.t, r:o.r, colle:1, ts:Date.now() })
  }).then(function(){
    delete objets[o.id]; delete miens[o.id]; noterMiens(); choisi=null;
    msg("Collé sur le mur","ok"); rendre();
  }).catch(function(e){ msg("Échec : "+e.message,"ko"); coller.disabled=false; });
});
retirer.addEventListener("click", function(){
  var o=objets[choisi]; if(!o) return;
  var id=o.id;
  fetch(RTDB+"/graffwall/envois/"+salle+"/pos/"+id+".json",{method:"DELETE"}).catch(function(){});
  fetch(RTDB+"/graffwall/envois/"+salle+"/objets/"+id+".json",{method:"DELETE"}).catch(function(){});
  delete objets[id]; delete miens[id]; noterMiens(); choisi=null;
  msg("Retiré"); rendre();
});

window.addEventListener("resize", taillerCanvas);
taillerCanvas();
})();
</script>
</body>
</html>
